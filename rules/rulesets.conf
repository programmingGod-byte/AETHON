# Rule sets loaded by Aethon at startup, in this order.
#
#   <file>   <mode>
#
# Modes:
#   block   every match resets the connection (use for your own, hand-written rules)
#   policy  reset only when the rule describes an attack on the server: action drop/reject,
#           signature_severity Major/Critical, or an attack classtype (web-application-attack,
#           attempted-admin, attempted-user, shellcode-detect, ...); other matches are only logged
#   alert   log only, never reset
#
# Rules are skipped automatically when Aethon cannot evaluate them correctly on inbound
# client -> server TCP streams: outbound rules ($HOME_NET -> $EXTERNAL_NET, e.g. malware C2),
# server-response rules (flow:to_client), negated contents, flowbits/byte_test/dsize conditions,
# non-HTTP-request buffers (TLS metadata, DNS, files), and third-party patterns that can match
# fewer than 6 bytes. Startup prints how many rules each file contributed.
#
# Files are relative to the repository root.

rules/test_rules.rules                    block

# Attacks against web servers and applications
rules/emerging-web_server.rules           policy
rules/emerging-web_specific_apps.rules    policy
rules/emerging-sql.rules                  policy
rules/emerging-exploit.rules              policy
rules/emerging-shellcode.rules            policy
rules/emerging-worm.rules                 policy
rules/emerging-dos.rules                  policy

# Noisy or informational: log only
rules/emerging-scan.rules                 alert
